<form id="needs-validation2" novalidate>
  <div class="row my-2">       
        <div class="col">          
         <label class="label_main2">G จำนวนคู่สบฟันแท้ ฟันแท้</label>
         <input id="permanent_permanent" type="number" min="0" max="10" step="1" class="form-control"  required> 
         <div style="text-align:left;" class = "invalid-feedback">จำเป็น</div>       
        </div>
  </div>
  <div class="row my-2">       
        <div class="col">          
         <label class="label_main2">H จำนวนคู่สบฟันแท้ ฟันเทียม</label>
         <input id="permanent_prosthesis" type="number" min="0" max="10" step="1" class="form-control"  required> 
         <div style="text-align:left;" class = "invalid-feedback">จำเป็น</div>       
        </div>
  </div>

  <div class="row my-2">       
        <div class="col">          
         <label class="label_main2">I จำนวนคู่สบฟันเทียม ฟันเทียม</label>
         <input id="prosthesis_prosthesis" type="number" min="0" max="8" step="1" class="form-control"  required> 
         <div style="text-align:left;" class = "invalid-feedback">จำเป็น</div>       
        </div>
  </div>

  <div class="row my-2">        
     <div class="col"> 
       <label class="label_main2">J ความจำเป็นในการใส่ฟันเทียม</label>
       <select id="need_prosthesis" class="form-select">
           <option value="1">1 ต้องใส่ฟันเทียมบนและล่าง</option>
           <option value="2">2 ต้องใส่ฟันเทียมบน</option>
           <option value="3">3 ต้องใส่ฟันเทียมล่าง</option>   
           <option value="4">4 ไม่ต้องใส่ฟันเทียม</option>             
       </select>
     </div>
  </div>

  <div class="row my-2">        
     <div class="col"> 
       <label class="label_main2">K ต้องขูดหินปูน</label>
       <select id="need_scaling" class="form-select">
           <option value="0">ไม่จำเป็น</option>
           <option value="1">จำเป็น</option>          
       </select>
     </div>
  </div>

  <div class="row my-2">       
      <div class="col"> 
        <label class="label_main2">L รอยโรคในช่องปาก</label>
        <input id="oral_lesion_text" class="form-control">
      </div>
  </div>

  <div class="row my-2">        
     <div class="col"> 
       <label class="label_main2">ผู้ตรวจ</label>
       <select id="inspector" class="form-select" required>
            <option></option>
            <option>ชไมพร สุขกาย</option>
            <option>จรัสพงษ์ รักประชา</option>
            <option>ศศิวิมล กาวิละ</option>            
            <option>สุเทียน แก้วมะคำ</option>
            <option>อารีย์ แก้วมะคำ</option>
            <option>พัชรินทร์ วงศ์ใชยา</option>
            <option>อภิชาติ เตชะอัตตกุล</option>            
            <option>ธัญวรัตม์ สารทอง</option>
            <option>บุษบา ทะนุก้ำ</option>   
            <option>นพรัตน์ หมอยาดี</option>       
       </select>
       <div style="text-align:left;" class = "invalid-feedback">จำเป็น</div>
     </div>
  </div>

  <div class="row my-2">
    <div class="col">
      <button class="btn btn-primary" onclick="form2PrvBtn()">ก่อนหน้า</button>
    </div>
    <div class="col">
      <button id="save_btn" class="btn btn-success w3-right" type="submit" onclick="beforeSubmit()">บันทึกข้อมูล</button>
    </div>
  </div>      
</form>
