<form id="form_detail" novalidate>    

   <div class="row my-2">               
        <div class="col"> 
          <label class="label_main">รพสต.</label>
          <input disabled id="form_cup" class="form-control">          
        </div>        
   </div>

   <div class="row my-2">  
       <div class="col"> 
          <label class="label_main">เลขหมู่บ้าน</label>
          <input disabled id="form_vhid" class="form-control">         
        </div>
   </div>

   <div class="row my-2">
        <input id="id_main" type="hidden">        
        <div class="col"> 
          <label class="label_main">ชื่อ</label>
          <input id="name" class="form-control" required>
          <div style="text-align:left;" class = "invalid-feedback">จำเป็น</div>
        </div>        
   </div>

   <div class="row my-2">
       <div class="col"> 
          <label class="label_main">นามสกุล</label>
          <input id="lname" class="form-control" required>
          <div style="text-align:left;" class = "invalid-feedback">จำเป็น</div>
        </div>
   </div>  

   <div class="row my-2">                
        <div class="col"> 
          <label class="label_main">เลขบัตรประชาชน</label>
          <input type="text" pattern="\d{13}" id="cid" class="form-control" placeholder="ไม่จำเป็น">  
          <div style="text-align:left;" class = "invalid-feedback">เลข 13 หลักเท่านั้น</div>         
        </div>         
   </div>

   <div class="row my-2"> 
        <div class="col"> 
          <label class="label_main">เพศ 1 = ชาย 2 = หญิง</label>
          <select id="sex" class="form-select" required>
            <option></option>  
            <option>1</option>
            <option>2</option>           
          </select>         
        </div>        
        
        <div class="col"> 
          <label class="label_main">อายุ</label>
          <input id="age" type="number" min="40"  step="1" class="form-control" required>
          <div style="text-align:left;" class = "invalid-feedback">อายุต้อง >= 40 ปี</div>
        </div>       
   </div>

   <div class="row my-2">
      <div class="col">
        <button  class="btn btn-primary" type="button" onclick="detailPrvBtn()">ก่อนหน้า</button>
      </div>
      <div class="col">
        <button  class="btn btn-primary w3-right" type="submit" onclick="detailNextBtn()">ถัดไป</button>
      </div>
   </div>  
</form>
